<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChattiNG</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #2f3136;
            color: #fff;
        }

        .container {
            max-width: 980px;
            margin: 40px auto;
            padding: 24px;
            background: #36393f;
            border-radius: 12px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        #chat {
            height: 360px;
            overflow-y: auto;
            border: 1px solid #202225;
            background: #2b2d31;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #40444b;
            line-height: 1.5;
        }

        .message strong {
            color: #90cdf4;
        }

        .message small {
            color: #b9bbbe;
            display: block;
            margin-top: 4px;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 12px;
        }

        input, button {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #555;
            margin: 6px 0;
        }

        input[type="text"], input[type="password"] {
            width: 240px;
            background: #202225;
            color: white;
        }

        button {
            background: #5865f2;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-box {
            max-width: 460px;
            margin: 60px auto;
            background: #2b2d31;
            padding: 28px;
            border-radius: 12px;
        }

        .danger {
            background: #d32f2f;
        }

        img, audio {
            max-width: 260px;
            display: block;
            margin-top: 8px;
            border-radius: 8px;
        }

        .small {
            font-size: 12px;
            color: #b9bbbe;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    {% if session.user %}
        <div class="container">
            <h2>ChattiNG — {{ session.user }}</h2>

            <form method="post" action="/logout">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <button type="submit">退出登录</button>
            </form>

            {% if session.user == "Junaylin" %}
                <form method="post" action="/ban">
                    <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                    <div class="row">
                        <input type="text" name="username" placeholder="要封禁的用户名" />
                        <button type="submit" class="danger">封禁用户</button>
                    </div>
                </form>
            {% endif %}

            <div id="chat"></div>

            <div class="row">
                <input id="text" type="text" placeholder="输入消息..." />
                <button onclick="sendText()">发送</button>
            </div>

            <div class="row">
                <input type="file" id="image" accept="image/*" />
                <button onclick="sendImage()">发送图片</button>
            </div>

            <div class="row">
                <input type="file" id="voice" accept="audio/*" />
                <button onclick="sendVoice()">发送语音</button>
            </div>
        </div>

        <script src="{{ url_for('static', filename='script.js') }}"></script>

    {% else %}
        <div class="login-box">
            <h2>登录 / 注册</h2>
            <form method="post" action="/">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">

                <div class="row">
                    <label>用户名：</label>
                    <input type="text" name="username" required />
                </div>

                <div class="row">
                    <label>密码：</label>
                    <input type="password" name="password" required />
                </div>

                <div class="row">
                    <button type="submit" name="action" value="login">登录</button>
                    <button type="submit" name="action" value="register">注册</button>
                </div>
            </form>

            <div class="small">提示：管理员用户名和密码建议使用环境变量配置，不要写死在代码里。</div>
        </div>
    {% endif %}
</body>
</html>
